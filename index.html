<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>City of London - Moderation</title>
</head>

<body>

    <header>
        <div class="header">
            <h1 class="header-title">City of London</h1>
            <div class="menu-icons">
                <span class="bi bi-person-circle"></span>
            </div>
        </div>
    </header>

    <div class="content">
        
        <div class="inputs">
            <label for="username">Roblox Username</label>
            <input type="text" id="username">
           
            <label for="">Log Type</label>
            <select id="logtype" name="Log Type">
                <option value="" disabled selected>Select a log type</option>
                <option value="warning">Warning</option>
                <option value="kick">Kick</option>
                <option value="ban">Ban</option>
                <option value="banbolo">Ban BOLO</option>
            </select>

        </div>
    </div>
</body>
</html>
