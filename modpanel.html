<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>City of London - Moderation</title>
</head>

<body>

    <header>
        <div class="header">
            <h1 class="header-title">City of London - Moderation Panel</h1>
            <div class="menu-icons">
                <span class="bi bi-person-circle"></span>
            </div>
        </div>
    </header>

    <div class="content">
        
        <div class="content-box" id="logbox">
            <h1>Create New Log </h1>
            <div class="log-create">
                <label for="username">Roblox Username</label>
                <input type="text" id="username">
            
                <label for="">Log Type</label>
                <select id="logtype" name="Log Type">
                    <option value="" disabled selected>Select a log type</option>
                    <option value="warning">Warning</option>
                    <option value="kick">Kick</option>
                    <option value="ban">Ban</option>
                    <option value="banbolo">Ban BOLO</option>
                </select>

                <label>Reason</label>
                <input type="text" id="reason">

                <button>Create Log</button>

            </div>
        </div>

        <div class="content-box" id="userbox">
            <div class="user-info">
                <div class="user-img">
                    <img src="https://tr.rbxcdn.com/30DAY-AvatarHeadshot-23154DF78B1C8A1DB7DC3C78FD17DDB4-Png/150/150/AvatarHeadshot/Webp/noFilter">
                </div>
                <div class="user-details">
                    <h1>[username placeholder]</h1>
                    <h2>ID: [placeholder]</h2>
                    <button id="discbtn"class="bi bi-discord"></button>
                </div>
            </div>
               
            
        
            </div>
        </div>
        
    </div>
</body>
</html>
