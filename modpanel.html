<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="global.css">
    <link rel="stylesheet" href="mainpage.css">
    <title>City of London - Moderation</title>
</head>

<body>

    <header>
        <div class="header">
            <h1 class="header-title"><img src="https://cdn.col-erlc.ca/files/images/67481c88-65e0-4af4-9c72-b46fa04d3361.svg">
                Moderation Panel</h1>
            <div class="menu-icons">
                <span class="bi bi-person-circle"></span>
            </div>
        </div>
    </header>

    <section class="content">

        <div class="col1">

            <div class="grid-boxsp">

                <div class="log-box">
                <h1 class="bi bi-journal-bookmark-fill"> Create New Log</h1>
                <label for="username">Roblox Username</label>
                    <input type="text" id="username">
                
                    <label for="">Log Type</label>
                    <select id="logtype" name="Log Type">
                        <option value="" disabled selected>Select a log type</option>
                        <option value="warning">Warning</option>
                        <option value="kick">Kick</option>
                        <option value="ban">Ban</option>
                        <option value="banbolo">Ban BOLO</option>
                    </select>

                    <label>Reason</label>
                    <input type="text" id="reason">

                    <button>Create Log</button>
                </div>

            </div>
            <div class="grid-boxsp" id="staffpane">
                <div class="staff-info">
                    <div class="staff-img">
                        <img src="https://upload.wikimedia.org/wikipedia/commons/8/89/Portrait_Placeholder.png">
                    </div>
                    <div class="staff-name">
                        <h1 class="bi bi-person-fill"> Hello [user]! </h1>
                           <h3>Shift Time: <span id="timeDisplay">00:00</span></h3>
                    </div>
                </div>
                <div class="">
                    
                </div>
                <div class="staff-btn">
                    <button class="toggleshift" id="shiftToggle" aria-pressed="false">Start Shift</button>
                    <button class="togglebreak" id="breakToggle" aria-pressed="false" disabled>Start Break</button>
                </div>
            </div>
        </div>

        <div class="col2">
            <div class="grid-box">
            
                <div class="user-box">
                    <div class="user-info">
                        <div class="user-img">
                            <img src="https://tr.rbxcdn.com/30DAY-AvatarHeadshot-23154DF78B1C8A1DB7DC3C78FD17DDB4-Png/150/150/AvatarHeadshot/Webp/noFilter">
                        </div>
                        <div class="user-details">
                            <h1>[username placeholder]</h1>
                            <h2>ID: [placeholder]</h2>
                           
                        </div>
                    </div>
                </div>

            </div>
            
        </div>

        <div class="col3">
            <div class="grid-box">
                <div class="records-box">
                    <h1 class="bi bi-search"> Viewing Logs for [user]</h1>
                </div>
            </div>

        </div>

    </section>
    <script src="script.js" defer></script>
</body>
</html>
